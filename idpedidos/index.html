<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ID Pedidos · FlowAI</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2563eb">
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1d2330; --muted: #6b7280; --border: #d9dde3;
    --ok: #16a34a; --ok-bg: #dcfce7; --bad: #dc2626; --bad-bg: #fee2e2; --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b2029; --text: #e7eaf0; --muted: #9aa3b2; --border: #2c3340;
      --ok: #22c55e; --ok-bg: #0f2e1b; --bad: #f87171; --bad-bg: #3a1414; --accent: #60a5fa;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 16px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 12px; }
  h1 { font-size: 20px; margin: 0; }
  #fecha { color: var(--muted); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  #id { width: 100%; font-size: 26px; font-weight: 600; letter-spacing: .5px; padding: 14px;
    border: 3px solid var(--border); border-radius: 10px; background: var(--card); color: var(--text); outline: none; }
  #id.ok  { border-color: var(--ok);  background: var(--ok-bg); }
  #id.bad { border-color: var(--bad); background: var(--bad-bg); }
  #estado { margin-top: 10px; min-height: 48px; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 17px;
    display: flex; align-items: center; justify-content: center; text-align: center; color: var(--muted); border: 1px dashed var(--border); }
  #estado.ok  { background: var(--ok);  color: #fff; border-color: transparent; }
  #estado.bad { background: var(--bad); color: #fff; border-color: transparent; }
  .fila { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); cursor: pointer; }
  button.primario { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  label { color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; }
  .lista-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .lista-head h2 { font-size: 16px; margin: 0; }
  #buscar { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--card); color: var(--text); font: inherit; margin-bottom: 8px; }
  ul { list-style: none; margin: 0; padding: 0; max-height: 45vh; overflow-y: auto; }
  li { display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 7px 4px; border-bottom: 1px solid var(--border); }
  li .pid { font-weight: 600; word-break: break-all; }
  li .hora { color: var(--muted); font-size: 12px; white-space: nowrap; }
  li.resaltado { background: var(--bad-bg); }
  li button { padding: 2px 8px; font-size: 13px; }
  .vacio { color: var(--muted); text-align: center; padding: 12px; }
  .pie { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .pie button { font-size: 13px; padding: 6px 10px; }
  li .plat { margin-left: 8px; font-weight: 500; font-size: 12px; padding: 1px 7px; border-radius: 999px;
    background: var(--bg); border: 1px solid var(--border); }
  #tirilla { display: none; }
  @media print {
    @page { margin: 3mm; }
    body { background: #fff; }
    main { display: none; }
    #tirilla { display: block; color: #000; font: 12px/1.35 "Courier New", monospace; }
    #tirilla table { width: 100%; border-collapse: collapse; }
    #tirilla th { text-align: left; border-bottom: 1px solid #000; }
    #tirilla td, #tirilla th { padding: 1px 2px; vertical-align: top; }
    #tirilla td:last-child, #tirilla .t-resumen td:last-child { text-align: right; }
    #tirilla hr { border: 0; border-top: 1px dashed #000; margin: 6px 0; }
    .t-centro { text-align: center; }
  }
  select { font: inherit; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--text); }
</style>
</head>
<body>
<main>
  <header>
    <h1>ID Pedidos</h1>
    <span id="fecha"></span>
  </header>

  <section class="card" id="verificador">
    <input id="id" type="text" autocomplete="off" spellcheck="false" placeholder="Pega el pedido, ej. ID: 48213 Rappi" autofocus>
    <div id="estado">Esperando un ID…</div>
    <div class="fila">
      <button id="registrar" class="primario" disabled>Marcar como despachado (Enter)</button>
      <button id="limpiar">Limpiar</button>
      <button id="flotar" hidden title="Ventana pequeña que se queda encima de las demás aplicaciones">📌 Siempre visible</button>
    </div>
    <div class="fila">
      <label><input type="checkbox" id="auto"> Registrar automáticamente al pegar si es nuevo</label>
    </div>
  </section>

  <section class="card">
    <div class="lista-head">
      <h2>Despachados <span id="dia-label">hoy</span>: <span id="total">0</span></h2>
      <select id="dia" title="Ver otro día"></select>
    </div>
    <input id="buscar" type="search" placeholder="Buscar en la lista…">
    <ul id="lista"></ul>
    <div class="pie">
      <button id="imprimir">🖨 Imprimir tirilla</button>
      <button id="exportar">Exportar CSV</button>
      <button id="borrarDia">Borrar lista de este día</button>
    </div>
  </section>
</main>
<div id="tirilla"></div>

<script>
(function () {
  var PREFIJO = 'idpedidos:';
  var $ = function (s) { return document.getElementById(s); };
  var input = $('id'), estado = $('estado'), btnReg = $('registrar'), lista = $('lista'),
      total = $('total'), selDia = $('dia'), buscar = $('buscar'), auto = $('auto');

  function hoy() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  // "ID: 48213 Rappi" → { num: '48213', plat: 'Rappi' }. El número se compara sin espacios y en mayúsculas.
  function interpretar(v) {
    var t = String(v || '').replace(/\s+/g, ' ').trim().replace(/^ID\s*:?\s*/i, '');
    var m = t.match(/^(\d+)\s*(.*)$/) || t.match(/^(\S+)\s*(.*)$/);
    return m ? { num: m[1].toUpperCase(), plat: m[2].trim() } : null;
  }
  function clavePlat(p) { return String(p || '').normalize('NFD').replace(/[̀-ͯ\s]/g, '').toLowerCase(); }
  // Mismo pedido = mismo número y misma plataforma (o una de las dos sin plataforma).
  function mismoPedido(a, b) {
    return a.num === b.num && (!a.plat || !b.plat || clavePlat(a.plat) === clavePlat(b.plat));
  }
  function etiqueta(r) { return 'ID: ' + r.num + (r.plat ? ' ' + r.plat : ''); }

  function leer(dia) {
    var datos;
    try { datos = JSON.parse(localStorage.getItem(PREFIJO + dia)) || []; } catch (e) { datos = []; }
    // Registros de la versión anterior solo tenían "id".
    return datos.map(function (r) {
      if (r.num) return r;
      var p = interpretar(r.id) || { num: String(r.id), plat: '' };
      return { num: p.num, plat: p.plat, hora: r.hora };
    });
  }
  function guardar(dia, datos) {
    try { localStorage.setItem(PREFIJO + dia, JSON.stringify(datos)); } catch (e) {}
  }
  function diasGuardados() {
    var dias = [];
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf(PREFIJO + '20') === 0) dias.push(k.slice(PREFIJO.length));
      }
    } catch (e) {}
    if (dias.indexOf(hoy()) < 0) dias.push(hoy());
    return dias.sort().reverse();
  }
  function buscarEnHoy(p) {
    var datos = leer(hoy()), res = { repetido: null, otra: null };
    for (var i = 0; i < datos.length; i++) {
      if (mismoPedido(datos[i], p)) { res.repetido = datos[i]; break; }
      if (datos[i].num === p.num) res.otra = datos[i];
    }
    return res;
  }

  var diaActual = hoy();

  function pintarDias() {
    var dias = diasGuardados();
    selDia.innerHTML = '';
    dias.forEach(function (d) {
      var o = document.createElement('option');
      o.value = d; o.textContent = d === hoy() ? 'Hoy (' + d + ')' : d;
      selDia.appendChild(o);
    });
    selDia.value = diaActual;
  }

  function pintarLista() {
    var datos = leer(diaActual).slice().reverse();
    var filtro = buscar.value.trim().toUpperCase();
    var actual = interpretar(input.value);
    total.textContent = datos.length;
    $('dia-label').textContent = diaActual === hoy() ? 'hoy' : 'el ' + diaActual;
    lista.innerHTML = '';
    var visibles = datos.filter(function (r) { return !filtro || etiqueta(r).toUpperCase().indexOf(filtro) >= 0; });
    if (!visibles.length) {
      var li = document.createElement('li');
      li.className = 'vacio';
      li.textContent = datos.length ? 'Sin coincidencias' : 'Aún no hay pedidos despachados';
      lista.appendChild(li);
      return;
    }
    visibles.forEach(function (r) {
      var li = document.createElement('li');
      if (actual && mismoPedido(r, actual) && diaActual === hoy()) li.className = 'resaltado';
      var izq = document.createElement('div');
      var pid = document.createElement('div'); pid.className = 'pid'; pid.textContent = 'ID: ' + r.num;
      if (r.plat) {
        var plat = document.createElement('span'); plat.className = 'plat'; plat.textContent = r.plat;
        pid.appendChild(plat);
      }
      var hora = document.createElement('div'); hora.className = 'hora'; hora.textContent = r.hora;
      izq.appendChild(pid); izq.appendChild(hora);
      var del = document.createElement('button');
      del.textContent = 'Quitar'; del.title = 'Quitar de la lista';
      del.onclick = function () {
        if (!confirm('¿Quitar ' + etiqueta(r) + ' de la lista?')) return;
        guardar(diaActual, leer(diaActual).filter(function (x) {
          return !(x.num === r.num && x.plat === r.plat && x.hora === r.hora);
        }));
        verificar(); pintarLista();
      };
      li.appendChild(izq); li.appendChild(del);
      lista.appendChild(li);
    });
  }

  function verificar() {
    var p = interpretar(input.value);
    input.classList.remove('ok', 'bad');
    estado.classList.remove('ok', 'bad');
    if (!p) {
      estado.textContent = 'Esperando un ID…';
      btnReg.disabled = true;
      return null;
    }
    var res = buscarEnHoy(p);
    if (res.repetido) {
      input.classList.add('bad'); estado.classList.add('bad');
      estado.textContent = '✖ REPETIDO — ' + etiqueta(res.repetido) + ' ya despachado hoy a las ' + res.repetido.hora;
      btnReg.disabled = true;
    } else {
      input.classList.add('ok'); estado.classList.add('ok');
      estado.textContent = '✔ NUEVO — no se ha despachado hoy' +
        (res.otra ? ' (ojo: el ' + res.otra.num + ' ya salió por ' + res.otra.plat + ')' : '');
      btnReg.disabled = false;
    }
    return res.repetido;
  }

  function registrar() {
    var p = interpretar(input.value);
    if (!p || buscarEnHoy(p).repetido) return false;
    var datos = leer(hoy());
    datos.push({ num: p.num, plat: p.plat, hora: new Date().toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) });
    guardar(hoy(), datos);
    diaActual = hoy();
    pintarDias();
    verificar();
    estado.textContent = '✔ NUEVO — registrado como despachado';
    btnReg.disabled = true;
    pintarLista();
    return true;
  }

  // Tirilla para impresora de recibos: todos los pedidos del día seleccionado, en orden de despacho.
  function imprimirTirilla() {
    var datos = leer(diaActual);
    if (!datos.length) { alert('No hay pedidos para imprimir en este día.'); return; }
    var t = $('tirilla'), porPlat = {};
    var esc = function (v) { var d = document.createElement('div'); d.textContent = v; return d.innerHTML; };
    var filas = datos.map(function (r, i) {
      var k = clavePlat(r.plat);
      porPlat[k] = porPlat[k] || { nombre: r.plat || 'Sin plataforma', n: 0 };
      porPlat[k].n++;
      return '<tr><td>' + (i + 1) + '</td><td>ID: ' + esc(r.num) + '</td><td>' + esc(r.plat) + '</td><td>' + esc(r.hora.slice(0, 5)) + '</td></tr>';
    }).join('');
    var resumen = Object.keys(porPlat).sort().map(function (k) {
      return '<tr><td>' + esc(porPlat[k].nombre) + '</td><td>' + porPlat[k].n + '</td></tr>';
    }).join('');
    t.innerHTML =
      '<div class="t-centro"><strong>PEDIDOS DESPACHADOS</strong><br>' + diaActual + '</div>' +
      '<hr><table><thead><tr><th>#</th><th>ID</th><th>Plataforma</th><th>Hora</th></tr></thead><tbody>' + filas + '</tbody></table>' +
      '<hr><table class="t-resumen">' + resumen + '<tr><td><strong>TOTAL</strong></td><td><strong>' + datos.length + '</strong></td></tr></table>' +
      '<hr><div class="t-centro">Impreso: ' + new Date().toLocaleString('es') + '</div>';
    window.print();
  }

  var pegado = false;
  input.addEventListener('paste', function () { pegado = true; });
  input.addEventListener('input', function () {
    if (diaActual !== hoy()) { diaActual = hoy(); pintarDias(); }
    var p = interpretar(input.value);
    if (pegado && auto.checked && p && !buscarEnHoy(p).repetido) registrar(); else verificar();
    pegado = false;
    pintarLista();
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); registrar(); input.select(); }
    if (e.key === 'Escape') { input.value = ''; verificar(); pintarLista(); }
  });
  // Al enfocar el cuadro, se selecciona todo para que el siguiente pegado reemplace el ID anterior.
  input.addEventListener('focus', function () { input.select(); });
  btnReg.onclick = function () { registrar(); input.focus(); };
  $('limpiar').onclick = function () { input.value = ''; verificar(); pintarLista(); input.focus(); };
  buscar.addEventListener('input', pintarLista);
  selDia.onchange = function () { diaActual = selDia.value; pintarLista(); };

  try { auto.checked = localStorage.getItem(PREFIJO + 'cfg:auto') === '1'; } catch (e) {}
  auto.onchange = function () { try { localStorage.setItem(PREFIJO + 'cfg:auto', auto.checked ? '1' : '0'); } catch (e) {} };

  $('exportar').onclick = function () {
    var datos = leer(diaActual);
    var q = function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; };
    var csv = 'id,plataforma,hora\n' + datos.map(function (r) { return [q(r.num), q(r.plat), r.hora].join(','); }).join('\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = 'pedidos-' + diaActual + '.csv';
    a.click();
  };
  $('imprimir').onclick = imprimirTirilla;
  $('borrarDia').onclick = function () {
    if (!confirm('¿Borrar todos los IDs del ' + diaActual + '? No se puede deshacer.')) return;
    try { localStorage.removeItem(PREFIJO + diaActual); } catch (e) {}
    diaActual = hoy(); pintarDias(); verificar(); pintarLista();
  };

  // Sincroniza si la página está abierta en varias pestañas.
  // Ventana flotante siempre encima (Document Picture-in-Picture, Chrome/Edge 116+).
  // Se mueve el cuadro de verificación a esa ventana y se devuelve al cerrarla.
  var btnFlotar = $('flotar'), verificador = $('verificador');
  if ('documentPictureInPicture' in window) btnFlotar.hidden = false;
  btnFlotar.onclick = function () {
    var abierta = window.documentPictureInPicture.window;
    if (abierta) { abierta.close(); return; }
    var marcador = document.createComment('verificador');
    window.documentPictureInPicture.requestWindow({ width: 420, height: 300 }).then(function (pip) {
      document.querySelectorAll('style').forEach(function (st) { pip.document.head.appendChild(st.cloneNode(true)); });
      pip.document.title = 'ID Pedidos';
      pip.document.body.style.padding = '8px';
      verificador.parentNode.insertBefore(marcador, verificador);
      pip.document.body.appendChild(verificador);
      btnFlotar.textContent = '↩ Volver a la página';
      input.focus();
      pip.addEventListener('pagehide', function () {
        marcador.parentNode.insertBefore(verificador, marcador);
        marcador.remove();
        btnFlotar.textContent = '📌 Siempre visible';
        verificar(); pintarLista();
      });
    }).catch(function () {
      alert('Tu navegador no permitió abrir la ventana flotante. Usa Chrome o Edge actualizados.');
    });
  };

  window.addEventListener('storage', function () { pintarDias(); verificar(); pintarLista(); });

  $('fecha').textContent = new Date().toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long' });
  pintarDias(); verificar(); pintarLista();

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
